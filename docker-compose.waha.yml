services:
  waha:
    image: devlikeapro/waha:latest
    container_name: nodopropiedades-waha
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_PRINT_QR=True
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_HOOK_URL=http://host.docker.internal:5678/webhook/evolution-whatsapp
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_NAMESPACE=all
      - WHATSAPP_FILES_FOLDER=/app/.media
      - WHATSAPP_FILES_LIFETIME=0
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      # Persistencia: no reescanear QR al reiniciar el proyecto
      - ./waha-data/sessions:/app/.sessions
      - ./waha-data/media:/app/.media
    extra_hosts:
      - "host.docker.internal:host-gateway"
